name: 🐛 버그 수정
description: 테스트 중 발생한 문제를 추적하기 위해 사용합니다.
title: "🐛 Bug: "
labels: ["Bug", "QA"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 📄 증상 설명
      placeholder: 예) 피드 새로고침 시 페이지가 멈춥니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔍 재현 절차
      placeholder: |
        1. 로그인 후 피드 진입
        2. 화면을 아래로 당김
        3. 에러 발생
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 🛠 테스트 환경
      placeholder: 예) Chrome 120, macOS 14 / Safari 17, iPhone 15
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 🖼 스크린샷 또는 로그
      placeholder: 예) 브라우저 콘솔 로그 첨부 또는 에러 화면
    validations:
      required: false
